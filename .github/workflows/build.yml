name: Actualizar y publicar

on:
  schedule:
    - cron: "7 22,23 * * *"   # cambio de día a medianoche de Madrid (verano e invierno)
    - cron: "35 18-21 * * *"  # precios de mañana (REE los publica hacia las 20:30)
    - cron: "20 6 * * *"      # mix de generación definitivo de ayer
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "static/**", "config.json", ".github/workflows/build.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Tests
        run: python3 -m unittest discover tests

      - id: pages
        uses: actions/configure-pages@v5

      - name: Descargar datos y generar la web
        run: python3 src/build.py --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Datos $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M')"
            git pull --rebase --quiet
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Si falta un dato importante, este paso falla y GitHub te envía un email.
      - name: Comprobar que no falta ningún dato importante
        run: python3 src/build.py --check
